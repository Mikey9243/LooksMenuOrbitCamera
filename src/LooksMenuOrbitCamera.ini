; LooksMenu Orbit Camera - settings
; Changes take effect the next time the game starts.
; Key codes are Windows virtual-key codes in hex (0x51 = Q, 0x45 = E, 0x21 = Page Up, 0x22 = Page Down, 0x24 = Home).

[General]
bEnableOrbitCamera=1          ; 0 = plugin does nothing
bEnableController=1           ; Xbox / XInput controller
bEnableMouseKeyboard=1
bAutomaticInputDetection=1    ; mouse and controller both work at any time, no switching needed
bStartFromLooksMenuView=1     ; 1 = start orbiting from where LooksMenu puts the camera (no jump); 0 = glide to the default view below
bBlockUsedInputFromLooksMenu=1 ; inputs the camera uses are not passed on to LooksMenu (so sliders/lists do not move while you orbit)
bFreezeCharacter=1            ; 1 = the character being edited (player or NPC) holds still while LooksMenu is open, 0 = it keeps moving as normal
bDebugLog=0                   ; 1 = extra lines in Documents\My Games\Fallout4\F4SE\LooksMenuOrbitCamera.log

[Camera]
fCameraDistance=150.0         ; distance after a reset
fMinimumZoom=40.0
fMaximumZoom=400.0
fCameraSensitivity=1.0        ; mouse rotation speed
fCameraSmoothing=8.0          ; higher = snappier, lower = smoother, 0 = no smoothing
fVerticalSensitivity=1.0      ; extra factor for up/down rotation
fFocusHeight=90.0             ; height on the character the camera looks at after a reset (about 115 = face, 90 = chest, 50 = hips)
fMinimumFocusHeight=0.0
fMaximumFocusHeight=200.0
fHeightAdjustSpeed=60.0       ; how fast Q/E, Page Up/Down and the D-pad move the camera up/down (units per second)
fMinimumPitch=-60.0           ; lowest camera angle in degrees (negative = camera below, looking up)
fMaximumPitch=80.0            ; highest camera angle in degrees
fMouseWheelZoomStep=0.12      ; share of the distance per wheel notch
bInvertVertical=0
bInvertHorizontal=0

[Controller]
fRightStickSensitivity=2.0
fLeftStickSensitivity=1.0     ; only used when bLeftStickPositioning=1
fDeadZone=0.18                ; 0.0 - 0.9 of the stick range; raise it if the camera drifts
fZoomSpeed=5.0
iDpadRaiseLower=1             ; 0 = off, 1 = D-pad up/down moves the camera while R3 is held, 2 = always (D-pad then no longer reaches LooksMenu)
bTriggerZoom=0                ; 1 = LT/RT zoom. Off by default: LooksMenu uses LT/RT (face preset, clothes, skin, slider steps)
bLeftStickPositioning=0       ; 1 = left stick up/down moves the camera height (LooksMenu then no longer gets the left stick)

[Controls]
bEnableResetCamera=1          ; middle mouse button / R3 tap
bEnableVerticalAdjustment=1
iRotateMouseButton=2          ; hold this to rotate: 1 = left, 2 = right, 3 = middle, 0 = always rotate (the cursor then moves too)
bWheelZoomOnlyWhileRotating=1 ; 1 = wheel zooms while the rotate button is held (LooksMenu uses the wheel for lists and sculpting); 0 = wheel always zooms
iKeyCameraUp=0x51             ; Q - camera up while the rotate button is held (LooksMenu uses Q for Skin, so it is only taken while rotating)
iKeyCameraDown=0x45           ; E - camera down while the rotate button is held (LooksMenu uses E for Accept/Select)
iKeyCameraUpAlways=0x21       ; Page Up - camera up at any time
iKeyCameraDownAlways=0x22     ; Page Down - camera down at any time
iKeyReset=0                   ; optional extra reset key (0 = none)
